[project]
name = "e-invoice-api"
version = "1.40.0"
description = "The official Python library for the e-invoice API"
dynamic = ["readme"]
license = "Apache-2.0"
authors = [
{ name = "E Invoice", email = "support@e-invoice.be" },
]

dependencies = [
  "httpx>=0.23.0, <1",
  "pydantic>=1.9.0, <3",
  "typing-extensions>=4.14, <5",
  "anyio>=3.5.0, <5",
]

requires-python = ">= 3.9"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "https://github.com/e-invoice-be/e-invoice-py"
Repository = "https://github.com/e-invoice-be/e-invoice-py"

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.9"]

[tool.rye]
managed = true
# version pins are in requirements-dev.lock
dev-dependencies = [
    "ty==0.0.86",
    "respx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "time-machine",
    "nox",
    "dirty-equals>=0.6.0",
    "importlib-metadata>=6.7.0",
    "rich>=13.7.1",
    "pytest-xdist>=3.6.1",
]

[tool.rye.scripts]
format = { chain = [
  "format:ruff",
  "format:docs",
  "fix:ruff",
  # run formatting again to fix any inconsistencies when imports are stripped
  "format:ruff",
]}
"format:docs" = "bash -c 'python scripts/utils/ruffen-docs.py README.md $(find . -type f -name api.md)'"
"format:ruff" = "ruff format"

"lint" = { chain = [
  "check:ruff",
  "typecheck",
  "check:importable",
]}
"check:ruff" = "ruff check ."
"fix:ruff" = "ruff check --fix ."

"check:importable" = "python -c 'import e_invoice_api'"

typecheck = "ty check"

[build-system]
requires = ["hatchling==1.26.3", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/*"
]

[tool.hatch.build.targets.wheel]
packages = ["src/e_invoice_api"]

[tool.hatch.build.targets.sdist]
# Basically everything except hidden files/directories (such as .github, .devcontainers, .python-version, etc)
include = [
  "/*.toml",
  "/*.json",
  "/*.lock",
  "/*.md",
  "/noxfile.py",
  "bin/*",
  "examples/*",
  "src/*",
  "tests/*",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# replace relative links with absolute links
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/e-invoice-be/e-invoice-py/tree/main/\g<2>)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -n auto"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
  "error"
]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# suppression comments must name a rule and must not go stale
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
blanket-ignore-comment = "error"

# rules that ty disables by default
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
invalid-mutable-override = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-condition-strict = "error"

[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py39"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # pycodestyle errors and warnings
  "E",
  "W",
  # pyflakes
  "F",
  # isort
  "I",
  # bugbear rules
  "B",
  # check for missing future annotations
  "FA102",
  # unused arguments
  "ARG",
  # print statements
  "T201",
  "T203",
  # debugger breakpoints
  "T10",
  # misuse of typing.TYPE_CHECKING
  "TC004",
  # import rules
  "TID251",
  # pyupgrade
  "UP",
  # flake8-simplify
  "SIM",
  # flake8-comprehensions
  "C4",
  # flake8-pie
  "PIE",
  # flake8-return
  "RET",
  # ruff-specific rules
  "RUF",
  # perflint
  "PERF",
  # flake8-pytest-style
  "PT",
  # implicit string concatenation
  "ISC",
  # pygrep-hooks (blanket noqa / type: ignore)
  "PGH",
  # logging misuse
  "LOG",
  "G",
  # naive datetimes
  "DTZ",
  # flake8-bandit (security)
  "S",
  # tryceratops
  "TRY",
  # pep8-naming
  "N",
  # blind except
  "BLE",
]
ignore = [
  # mutable defaults
  "B006",
  # line length is left to `ruff format`; long docstrings and URLs come from the API spec
  "E501",
  # `X | None` / `X | Y` annotations are evaluated at runtime by pydantic and break on Python 3.9,
  # even with `from __future__ import annotations`; keep `Optional` / `Union` everywhere for consistency
  "UP007",
  "UP045",
  # keep the `typing.List` / `typing.Dict` style used throughout the SDK and its models
  "UP006",
  "UP035",
  # SDK errors carry descriptive messages; a dedicated exception class per message is overkill
  "TRY003",
  # explicit try/except/pass reads clearer (and is cheaper) than contextlib.suppress
  "SIM105",
  # try/except in a loop is intentional (fallback parsing) and zero-cost on Python 3.11+
  "PERF203",
]
unfixable = [
  # disable auto fix for print statements
  "T201",
  "T203",
]

extend-safe-fixes = ["FA102"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "This function does not retain type information for the wrapped function's arguments; The `lru_cache` function from `_utils` should be used instead"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["e_invoice_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
# dev scripts shell out to trusted, fixed commands
"scripts/**.py" = ["T201", "T203", "S603", "S607"]
# tests use bare asserts, naive datetimes, fixed fake credentials, `dict(...)` payloads and
# deliberately unbounded httpx timeouts; local type aliases/constants are named like globals
"tests/**.py" = ["T201", "T203", "S101", "S105", "S106", "S113", "DTZ", "C408", "N806"]
"examples/**.py" = ["T201", "T203"]
# lenient, never-failing model construction; `!= False` checks guard pydantic v2-only kwargs in the v1 shim
"src/e_invoice_api/_models.py" = ["BLE001", "S110", "S112", "E712"]
# port of pydantic v1's datetime parsing, which deliberately returns naive datetimes when no offset is given
"src/e_invoice_api/_utils/_datetime_parse.py" = ["DTZ"]
